x-logging: &default-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    container_name: cart-api-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cart_user
      POSTGRES_PASSWORD: cart_password
      POSTGRES_DB: cart_api
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cart_user -d cart_api"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - cart_api_postgres_data:/var/lib/postgresql/data
    logging: *default-logging

  migrate:
    build:
      context: .
      target: build
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://cart_user:cart_password@postgres:5432/cart_api?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    logging: *default-logging

  api:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://cart_user:cart_password@postgres:5432/cart_api?schema=public
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    logging: *default-logging

volumes:
  cart_api_postgres_data:
