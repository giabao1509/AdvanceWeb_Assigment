syntax = "proto3";

// Package giữ nguyên qua mọi revision: đổi package = đổi tên service trên wire = phá client cũ.
package inventory;

import "google/protobuf/timestamp.proto";

service InventoryService {
  // Giữ hàng cho một order.
  // Lỗi nghiệp vụ trả bằng gRPC status:
  //   NOT_FOUND           – SKU không tồn tại
  //   FAILED_PRECONDITION – thiếu hàng; trailer x-available-stock, x-requested
  //   INVALID_ARGUMENT    – sku rỗng / quantity <= 0
  rpc Reserve(ReserveRequest) returns (ReserveResponse);
}

message ReserveRequest {
  string sku = 1;
  int32 quantity = 2;
}

message ReserveResponse {
  string reservation_id = 1;
  string sku = 2;
  int32 quantity = 3;
  // v2: thời điểm hết hạn giữ hàng. Tag mới (4); field 1–3 không đổi tag/kiểu/nghĩa.
  // Kiểu message nên có presence: vắng (server v1) ≠ có giá trị. Client PHẢI kiểm tra presence,
  // không được hiểu vắng thành epoch 1970-01-01.
  google.protobuf.Timestamp reservation_expires_at = 4;
}
